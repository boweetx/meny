<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор меню — Ресторан «Аура»</title>
  <style>
    :root {
      --bg: #0f1117;
      --card-bg: #1a1d26;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #2d3342;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 100px; }
    header { background: #141721; border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 18px; font-weight: 700; color: #fff; }
    header span { font-size: 13px; color: var(--accent); }
    
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }
    
    .user-block { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 16px; }
    .user-block label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
    .user-block input { width: 100%; padding: 10px 12px; background: #0f1117; border: 1px solid var(--border); border-radius: 8px; color: #fff; font-size: 15px; }

    .search-block { margin-bottom: 14px; }
    .search-block input { width: 100%; padding: 10px 14px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    .search-block input:focus { border-color: var(--accent); }

    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text-muted); padding: 8px 14px; border-radius: 20px; white-space: nowrap; font-size: 13px; cursor: pointer; }
    .cat-btn.active { background: var(--accent); color: #000; font-weight: 600; border-color: var(--accent); }

    .items-grid { display: flex; flex-direction: column; gap: 10px; }
    .item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 14px; display: flex; justify-content: space-between; align-items: center; }
    .item-info { flex: 1; padding-right: 12px; }
    .item-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .item-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 6px; line-height: 1.3; }
    .item-meta { font-size: 14px; font-weight: 700; color: var(--accent); }
    .item-weight { font-size: 12px; font-weight: 400; color: var(--text-muted); margin-left: 6px; }

    .counter { display: flex; align-items: center; gap: 8px; }
    .counter button { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #262b38; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .counter button:active { background: var(--accent); color: #000; }
    .counter span { font-size: 15px; font-weight: 600; min-width: 20px; text-align: center; }

    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #141721; border-top: 1px solid var(--border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
    .total-price { font-size: 18px; font-weight: 700; color: #fff; }
    .total-count { font-size: 12px; color: var(--text-muted); }
    .action-btn { background: var(--accent); color: #000; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .action-btn:active { background: var(--accent-hover); }

    /* Modal */
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; align-items: center; justify-content: center; padding: 16px; }
    .modal.active { display: flex; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 480px; padding: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .order-list { margin-bottom: 16px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; background: #12151e; padding: 12px; border-radius: 8px; border: 1px solid var(--border); }
    .btn-group { display: flex; flex-direction: column; gap: 8px; }
    .btn-tg { background: #229ED9; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; text-align: center; font-size: 14px; }
    .btn-copy { background: #374151; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 14px; }
    .btn-close { background: transparent; color: var(--text-muted); border: 1px solid var(--border); padding: 10px; border-radius: 10px; cursor: pointer; margin-top: 4px; font-size: 14px; }
  </style>
</head>

    let cart = {};
    let activeCat = "Все";

    function init() {
      const savedName = localStorage.getItem("guest_name");
      if (savedName) document.getElementById("userName").value = savedName;

      const cats = ["Все", ...new Set(MENU.map(i => i.cat))];
      const catBox = document.getElementById("categoryContainer");
      catBox.innerHTML = cats.map(c => 
        `<button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`
      ).join("");

      renderItems();
    }

    function saveName() {
      localStorage.setItem("guest_name", document.getElementById("userName").value.trim());
    }

    function filterCat(c) {
      activeCat = c;
      document.querySelectorAll(".cat-btn").forEach(b => b.classList.toggle("active", b.innerText === c));
      renderItems();
    }

    function renderItems() {
      const search = (document.getElementById("searchInput").value || "").toLowerCase().trim();
      let filtered = activeCat === "Все" ? MENU : MENU.filter(i => i.cat === activeCat);

      if (search) {
        filtered = filtered.filter(i => 
          i.name.toLowerCase().includes(search) || 
          (i.desc && i.desc.toLowerCase().includes(search))
        );
      }

      const box = document.getElementById("itemsContainer");
      if (filtered.length === 0) {
        box.innerHTML = `<div style="text-align:center; padding:30px 10px; color:var(--text-muted); font-size:14px;">Ничего не найдено</div>`;
        return;
      }

      box.innerHTML = filtered.map(item => {
        const qty = cart[item.name] || 0;
        return `
          <div class="item-card">
            <div class="item-info">
              <div class="item-title">${item.name}</div>
              ${item.desc ? `<div class="item-desc">${item.desc}</div>` : ''}
              <div>
                <span class="item-meta">${item.price} ₽</span>
                <span class="item-weight">${item.weight}</span>
              </div>
            </div>
            <div class="counter">
              <button onclick="changeQty('${item.name}', -1)">-</button>
              <span>${qty}</span>
              <button onclick="changeQty('${item.name}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");
      updateTotals();
    }

    function changeQty(name, delta) {
      const current = cart[name] || 0;
      const next = current + delta;
      if (next > 0) cart[name] = next;
      else delete cart[name];
      renderItems();
    }

    function updateTotals() {
      let sum = 0;
      let count = 0;
      for (const [name, qty] of Object.entries(cart)) {
        const item = MENU.find(m => m.name === name);
        if (item) {
          sum += item.price * qty;
          count += qty;
        }
      }
      document.getElementById("totalPrice").innerText = `${sum.toLocaleString("ru-RU")} ₽`;
      document.getElementById("totalCount").innerText = count ? `Выбрано позиций: ${count}` : "Блюд не выбрано";
    }

    function getFormattedText() {
      const name = document.getElementById("userName").value.trim() || "Гость";
      let lines = [`Заказ [${name}]:`];
      let sum = 0;
      for (const [nameItem, qty] of Object.entries(cart)) {
        const item = MENU.find(m => m.name === nameItem);
        if (item) {
          const cost = item.price * qty;
          sum += cost;
          lines.push(`• ${item.name} — ${qty} шт. (${cost} ₽)`);
        }
      }
      lines.push(`────────────────────`);
      lines.push(`Итого к оплате: ${sum.toLocaleString("ru-RU")} ₽`);
      return { text: lines.join("\n"), sum, count: Object.keys(cart).length };
    }

    function openOrderModal() {
      const { text, count } = getFormattedText();
      if (count === 0) {
        alert("Выберите хотя бы одно блюдо в меню");
        return;
      }
      document.getElementById("modalOrderList").innerText = text;
      document.getElementById("orderModal").classList.add("active");
    }

    function closeOrderModal() {
      document.getElementById("orderModal").classList.remove("active");
    }

    function copyOrderText() {
      const { text } = getFormattedText();
      navigator.clipboard.writeText(text).then(() => {
        alert("Заказ скопирован в буфер обмена! Вставьте его в ваш чат.");
      });
    }

    function shareToTelegram() {
      const { text } = getFormattedText();
      const url = `https://t.me/share/url?text=${encodeURIComponent(text)}`;
      window.open(url, "_blank");
    }

    init();
  </script>
